<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Check the current weather for any city. Powered by Open-Meteo.">
    <title>Atmos — Weather App</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">

    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js" defer></script>
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            <h1>Atmos</h1>
            <p class="site-subtitle">Accurate weather for any city</p>
        </div>
    </header>

    <main class="app">
        <form id="search-form" class="search-form" novalidate>
            <label for="city-input" class="visually-hidden">City name</label>
            <input
                type="text"
                id="city-input"
                name="city"
                placeholder="Enter a city&hellip;"
                aria-label="City name"
                required
                autocomplete="off"
            >
            <button type="submit" id="search-btn" class="search-button">Search</button>
        </form>

        <p id="status" class="status" role="status" aria-live="polite" aria-atomic="true">
            Search for a city to see its weather.
        </p>

        <!-- Current weather -->
        <section id="weather-card" class="weather-card" hidden aria-labelledby="city-name">
            <div class="weather-header">
                <h2 id="city-name">City</h2>
                <p id="city-country" class="city-country"></p>
                <time id="local-time" class="local-time"></time>
            </div>

            <div class="weather-main">
                <img id="weather-icon" class="weather-icon" src="" alt="" width="120" height="120">
                <div class="temperature-wrapper">
                    <p id="temperature" class="temperature">--&deg;</p>
                    <p id="description" class="condition">Weather condition</p>
                </div>
            </div>

            <p id="feels-note" class="feels-note"></p>

            <p id="data-source" class="data-source"></p>

            <div class="details-grid">
                <div class="detail-card">
                    <span class="detail-label">Feels like</span>
                    <strong id="feels-like" class="detail-value">--</strong>
                </div>
                <div class="detail-card">
                    <span class="detail-label">Humidity</span>
                    <strong id="humidity" class="detail-value">--</strong>
                </div>
                <div class="detail-card">
                    <span class="detail-label">Wind</span>
                    <strong id="wind-speed" class="detail-value">--</strong>
                </div>
                <div class="detail-card">
                    <span class="detail-label">Pressure</span>
                    <strong id="pressure" class="detail-value">--</strong>
                </div>
            </div>

            <button type="button" id="unit-btn" class="unit-button">Switch to Fahrenheit (&deg;F)</button>
        </section>

        <!-- Hourly forecast -->
        <section id="hourly-section" class="forecast-section" hidden aria-labelledby="hourly-heading">
            <h2 id="hourly-heading">Hourly forecast</h2>
            <div id="hourly-list" class="hourly-list"></div>
        </section>

        <!-- Daily forecast -->
        <section id="daily-section" class="forecast-section" hidden aria-labelledby="daily-heading">
            <h2 id="daily-heading">Seven-day forecast</h2>
            <div id="daily-list" class="daily-list"></div>
        </section>
    </main>

    <footer class="site-footer">
        <p>Weather data provided by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a></p>
    </footer>

</body>
</html>
